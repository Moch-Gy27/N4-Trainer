const words=data.split('§').map((x,i)=>{let [g,l,k,r,m]=x.split('|');return{id:i,g,l:+l,k,r,m,kanji:k!==r}});const dirs={ka:['Kanji → Arti','m',w=>w.k,w=>'Baca: '+w.r,1,true],ra:['Bunyi → Arti','m',w=>w.r,w=>'Pilih arti yang tepat',.9,false],kr:['Kanji → Hiragana','r',w=>w.k,w=>'Pilih cara baca yang tepat',1.1,true],rk:['Hiragana → Kanji','k',w=>w.r,w=>'Pilih tulisan Jepang yang tepat',1.3,true],mr:['Arti → Hiragana','r',w=>cap(w.m),w=>'Pilih cara baca yang tepat',1.4,false],mk:['Arti → Kanji','k',w=>cap(w.m),w=>'Pilih tulisan Jepang yang tepat',1.6,true]};const SESSION_MS=120000,KEY='kotoba-path-v1';let state=load(),run,tickId;function cap(s){return s[0].toUpperCase()+s.slice(1)}function load(){try{return{r:{},sess:{},today:{},...JSON.parse(localStorage.getItem(KEY))}}catch{return{r:{},sess:{},today:{}}}}function save(){localStorage.setItem(KEY,JSON.stringify(state))}function date(){let d=new Date;return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}function R(key){return state.r[key]||(state.r[key]={n:0,c:0,t:0,m:0,st:0,due:0})}function gradeWords(g){return words.filter(w=>w.g===g)}function available(w,d){return !dirs[d][5]||w.kanji}function gradeM(g){let a=gradeWords(g).flatMap(w=>Object.keys(dirs).filter(d=>available(w,d)).map(d=>state.r[w.id+'|'+d]?.m||0));return a.reduce((x,y)=>x+y,0)/a.length}function gradeN(g){return gradeWords(g).flatMap(w=>Object.keys(dirs).filter(d=>available(w,d)&&state.r[w.id+'|'+d])).filter(Boolean).length}function gradeCoverage(g){let ws=gradeWords(g);return ws.length?ws.filter(w=>Object.keys(dirs).some(d=>state.r[w.id+'|'+d]?.n)).length/ws.length*100:0}function gate(i){return i<8?{mastery:45,answers:6,coverage:60}:{mastery:65,answers:12,coverage:70}}function unlocked(){let n=0;for(let i=0;i<grades.length-1;i++){let g=gate(i);if(gradeM(grades[i])>=g.mastery&&gradeN(grades[i])>=g.answers&&gradeCoverage(grades[i])>=g.coverage)n=i+1;else break}return n}function current(){return grades[unlocked()]}function sess(t){return state.sess[date()]?.[t]}
function render(){let u=unlocked(),c=current(),s=['pagi','siang','malam'];app.innerHTML=`<div class="head"><div><h1>Kotoba <span style="color:#3867ff">Path</span></h1><p class="sub">Mode test: 2 menit per sesi · tanpa materi bunpou atau tombol self-rating.</p></div><button onclick="resetAll()">Reset progres</button></div><div class="grid"><section class="card"><span class="tag">Grade aktif: ${c}</span><h2 style="margin:10px 0 0">Hafalin kotoba, bertahap.</h2><p class="sub">Buka grade selanjutnya saat mastery ${c} mencapai 65% dan minimal 12 arah kartu sudah dikerjakan.</p><div class="sessions">${[['pagi','🌅 Kotoba baru'],['siang','☀️ Review grade sebelumnya'],['malam','🌙 Campuran pagi + siang']].map(([t,n])=>`<div class="session ${sess(t)?'done':''}"><b>${n}</b><small>${sess(t)?'✓ '+sess(t).q+' soal · '+sess(t).a+'%':'2 menit (test)'}</small><button class="${t==='pagi'?'primary':''}" style="margin-top:9px;width:100%" onclick="start('${t}')">${sess(t)?'Ulang':'Mulai'}</button></div>`).join('')}</div></section><aside class="card"><h2>Progress</h2><div class="stats"><div class="stat"><b>${Math.round(gradeM(c))}%</b><small>mastery ${c}</small></div><div class="stat"><b>${Object.values(state.r).reduce((a,x)=>a+x.n,0)}</b><small>jawaban</small></div><div class="stat"><b>${Object.values(state.r).filter(x=>x.due&&x.due<Date.now()).length}</b><small>review jatuh tempo</small></div></div><p class="sub" style="margin-top:15px">Pagi memakai grade aktif. Siang mengambil grade sebelum ${c}. Malam mencampurkan kartu yang keluar hari ini.</p></aside></div><section class="card" style="margin-top:15px"><h2>Jalur grade</h2><div class="grades">${grades.map((g,i)=>`<button class="grade ${i===u?'now':''} ${i>u?'lock':''}" ${i>u?'disabled':''} onclick="showGrade('${g}')"><b>${g} ${i>u?'🔒':''}</b><small>L${i*3+1}–L${i*3+3}</small><div class="bar"><i style="width:${Math.round(gradeM(g))}%"></i></div><small>${Math.round(gradeM(g))}%</small></button>`).join('')}</div></section>`}function showGrade(g){alert(`${g}: ${gradeWords(g).length} kotoba awal\nMastery: ${Math.round(gradeM(g))}%`)}
function cardsFor(t){let ci=unlocked(),now=Date.now(),all=words.flatMap(w=>Object.keys(dirs).filter(d=>available(w,d)).map(d=>({w,d,r:state.r[w.id+'|'+d]})));let pool;if(t==='pagi')pool=all.filter(x=>x.w.g===current());else if(t==='siang'){pool=all.filter(x=>grades.indexOf(x.w.g)<ci);if(!pool.length)pool=all.filter(x=>x.w.g===current()&&x.r?.n)}else{let ids=Object.values(state.today[date()]||{}).flat();pool=ids.map(key=>{let [id,d]=key.split('|'),w=words.find(x=>x.id===+id);return w&&{w,d,r:state.r[key]}}).filter(Boolean);if(!pool.length)pool=all.filter(x=>grades.indexOf(x.w.g)<=ci)}let notMastered=pool.filter(x=>!(x.r?.m>=100&&x.r.due>now));if(notMastered.length)pool=notMastered;let notHeld=pool.filter(x=>!x.r?.hold||x.r.hold<=now);if(notHeld.length)pool=notHeld;let due=pool.filter(x=>x.r?.due<=now),fresh=pool.filter(x=>!x.r?.n);return(due.length&&(t==='siang'||Math.random()<.45)?due:fresh.length?fresh:pool).sort((a,b)=>score(b,now)-score(a,now))}function score(x,n){let r=x.r||{},late=Math.max(0,n-(r.due||n))/36e5;return(100-(r.m||0))*2+late*8+Math.random()*10}
function start(type){run={type,start:Date.now(),end:Date.now()+SESSION_MS,q:0,c:0,seen:[]};panel.className='panel show';next();tickId=setInterval(timer,250)}function timer(){let left=Math.max(0,run.end-Date.now());let el=document.getElementById('timer');if(el)el.textContent=fmt(left);if(!left)finish()}function fmt(ms){let s=Math.ceil(ms/1000);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function next(){let pool=cardsFor(run.type);if(!pool.length)return finish();pool.sort((a,b)=>score(b,Date.now())-score(a,Date.now()));let q=pool[0],d=dirs[q.d],field=d[1],bank=words.filter(w=>available(w,q.d)).map(w=>w[field]).filter((v,i,a)=>a.indexOf(v)===i),opts=[q.w[field],...bank.filter(x=>x!==q.w[field]).sort(()=>Math.random()-.5).slice(0,3)].sort(()=>Math.random()-.5);run.q0=q;run.shown=performance.now();panel.innerHTML=`<div class="study"><div class="top"><button onclick="finish()">Selesai</button><span><span class="tag">${run.type==='pagi'?'Kotoba baru':run.type==='siang'?'Review sebelumnya':'Review campuran'}</span> <b class="timer" id="timer">${fmt(run.end-Date.now())}</b></span></div><section class="card q"><span class="tag">${q.w.g} · Lesson ${q.w.l} · ${d[0]}</span><div class="prompt">${d[2](q.w)}</div><div class="hint">${d[3](q.w)}</div><div class="choices">${opts.map((x,i)=>`<button class="choice" onclick="answer(${x===q.w[field]},this)">${'ABCD'[i]}. ${x}</button>`).join('')}</div><div id="fb" class="feedback"></div><button id="nx" class="primary next" onclick="next()">Soal berikutnya →</button></section></div>`;timer()}
function answer(ok,btn){let q=run.q0,ms=Math.round(performance.now()-run.shown),key=q.w.id+'|'+q.d,r=R(key),foundation=grades.indexOf(q.w.g)<8,mastered=ok&&ms<(foundation?5000:2000),fast=ok&&ms<5000;r.n++;r.c+=+ok;r.t+=ms;r.st=ok?r.st+1:0;r.m=mastered?100:ok?Math.round(Math.min(100,r.m*(fast?.68:.78)+(fast?32:18))):Math.round(r.m*.62);let ds=[.25,1,3,7,14,30],gap=fast?1.8:.65;r.due=mastered?Date.now()+30*864e5:Date.now()+(ok?ds[Math.min(r.st-1,5)]*864e5*gap:300000);r.hold=ok?0:run.end;run.q++;run.c+=+ok;run.seen.push(key);document.querySelectorAll('.choice').forEach(b=>{b.disabled=true;if(b.textContent.endsWith(q.w[dirs[q.d][1]]))b.classList.add('good')});if(!ok)btn.classList.add('bad');fb.className='feedback show '+(ok?'good':'bad');let timing=mastered?`<b>Mastery (&lt;${foundation?5:2} dtk):</b> langsung dianggap mengerti; review berikutnya 30 hari lagi.`:fast?'<b>Respons cepat (&lt;5 dtk):</b> kartu naik mastery dan review-nya dijauhkan.':ok?'Benar, tetapi respons lebih dari 5 dtk: review dibuat lebih dekat.':'Masuk antrean review sesi berikutnya.';fb.innerHTML=`<b>${ok?'✓ Benar':'✕ Belum tepat'}</b><br>${q.w.k}（${q.w.r}）= ${q.w.m}<br><small>${(ms/1000).toFixed(1)} dtk · ${timing}</small>`;nx.className='primary next show';save()}
function finish(){if(!run)return;clearInterval(tickId);let d=date();state.sess[d]??={};state.sess[d][run.type]={q:run.q,a:run.q?Math.round(run.c/run.q*100):0};state.today[d]??={};state.today[d][run.type]=[...new Set(run.seen)];save();panel.innerHTML=`<div class="study"><section class="card q"><span class="tag">Sesi tercatat</span><h1 style="margin-top:16px">${run.q} soal · ${run.q?Math.round(run.c/run.q*100):0}% benar</h1><p class="sub">Progress grade dan prioritas review sudah diperbarui.</p><button class="primary" onclick="closePanel()">Kembali ke dashboard</button></section></div>`;run=null}function closePanel(){panel.className='panel';render()}function resetAll(){if(confirm('Hapus semua progres kotoba di browser ini?')){localStorage.removeItem(KEY);state=load();render()}}
let listGrade='';function wordMastery(w){let a=Object.keys(dirs).filter(d=>available(w,d)).map(d=>state.r[w.id+'|'+d]).filter(Boolean);return a.length?Math.round(a.reduce((n,r)=>n+r.m,0)/a.length):0}function wordAttempts(w){return Object.keys(dirs).filter(d=>available(w,d)&&state.r[w.id+'|'+d]).length}function reviewLabel(w){let a=Object.keys(dirs).map(d=>state.r[w.id+'|'+d]?.due||0).filter(Boolean);if(!a.length)return'Belum mulai';let x=Math.min(...a)-Date.now();return x<=0?'Review sekarang':x<864e5?'Hari ini':'Nanti'}const baseRender=render;render=function(){baseRender();let u=unlocked(),g=listGrade||current();let rows=gradeWords(g).map(w=>`<tr><td>L${w.l}</td><td><b class="word">${w.k}</b><br><small>${w.r}</small></td><td>${w.m}</td><td><b>${wordMastery(w)}%</b><div class="bar"><i style="width:${wordMastery(w)}%"></i></div></td><td>${wordAttempts(w)}/${Object.keys(dirs).filter(d=>available(w,d)).length}</td><td>${reviewLabel(w)}</td></tr>`).join('');app.insertAdjacentHTML('beforeend',`<section class="card" style="margin-top:15px"><div class="head"><div><h2 style="margin:0">Daftar kotoba & progres</h2><p class="sub" style="margin:4px 0 0">Semua grade dapat dilihat di tabel; grade yang terkunci belum akan masuk ke sesi latihan.</p></div><select onchange="listGrade=this.value;render()">${grades.map(x=>`<option ${x===g?'selected':''}>${x}</option>`).join('')}</select></div><div class="tablewrap"><table><thead><tr><th>Lesson</th><th>Kotoba</th><th>Arti</th><th>Mastery</th><th>Arah</th><th>Review</th></tr></thead><tbody>${rows}</tbody></table></div></section>`)};render();
let displayedDay=date();const renderDaily=render;render=function(){renderDaily();document.querySelectorAll('.session button').forEach(b=>{if(b.textContent==='Mulai')b.textContent='Kerjakan'})};setInterval(()=>{if(date()!==displayedDay){displayedDay=date();render()}},30000);const completeCycle=finish;finish=function(){let completedNight=run?.type==='malam';completeCycle();if(completedNight){let d=date();state.sess[d]={};state.today[d]={};save()}};const renderSequence=render;render=function(){renderSequence();let order=['pagi','siang','malam'],next=order.findIndex(t=>!sess(t));if(next<0)next=0;document.querySelectorAll('.session button').forEach((b,i)=>b.classList.toggle('primary',i===next))};const startFifteen=start;start=function(type){startFifteen(type);if(run){run.end=run.start+900000;timer()}};const renderFifteen=render;render=function(){renderFifteen();document.querySelector('.head .sub').textContent='3 sesi belajar × 15 menit · tanpa materi bunpou atau tombol self-rating.';document.querySelectorAll('.session small').forEach(x=>{if(x.textContent==='2 menit (test)')x.textContent='15 menit'})};const DEADLINE=new Date(2026,11,1,23,59,59);function deadlineStats(){let now=new Date(),days=Math.max(1,Math.ceil((DEADLINE-now)/864e5)),started=words.filter(w=>Object.keys(dirs).filter(d=>available(w,d)).some(d=>state.r[w.id+'|'+d]?.n)).length,complete=words.filter(w=>Object.keys(dirs).filter(d=>available(w,d)).every(d=>(state.r[w.id+'|'+d]?.m||0)>=80)).length,remaining=words.length-complete;return{days,started,complete,remaining,perDay:Math.ceil(remaining/days)}}const renderDeadline=render;render=function(){renderDeadline();let x=deadlineStats();app.insertAdjacentHTML('afterbegin',`<section class="card" style="margin-bottom:15px;border-color:#b9c8ff"><div class="head"><div><span class="tag">Target JLPT N4 · selesai 1 Desember 2026</span><h2 style="margin:10px 0 0">${x.days} hari tersisa</h2><p class="sub" style="margin:4px 0 0">Kotoba dianggap selesai saat dua arah hafalannya mencapai minimal 80%.</p></div><div class="stats"><div class="stat"><b>${x.complete}/${words.length}</b><small>kotoba kuat</small></div><div class="stat"><b>${x.perDay}</b><small>perlu dikuatkan/hari</small></div><div class="stat"><b>${x.started}</b><small>sudah disentuh</small></div></div></div></section>`)};render();
const renderNoCountdown=render;render=function(){renderNoCountdown();let title=[...document.querySelectorAll('.card h2')].find(x=>x.textContent.includes('hari tersisa'));if(title)title.textContent='Target kotoba menuju 1 Desember 2026'};
function backupProgress(){let payload={app:'Kotoba Path',version:1,exportedAt:new Date().toISOString(),progress:state};let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}));a.download='kotoba-path-backup-'+date()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function importProgress(){let input=document.createElement('input');input.type='file';input.accept='application/json,.json';input.onchange=()=>{let file=input.files[0];if(!file)return;let reader=new FileReader();reader.onload=()=>{try{let payload=JSON.parse(reader.result),next=payload.progress||payload;if(!next||typeof next!=='object'||!next.r)throw new Error('Format tidak cocok');state={r:{},sess:{},today:{},...next};save();render();alert('Progres berhasil dipulihkan.')}catch{alert('File backup tidak valid. Pilih file .json dari Kotoba Path.')}};reader.readAsText(file)};input.click()}const renderBackup=render;render=function(){renderBackup();let actions=document.querySelector('.head');if(actions){let box=document.createElement('div');box.className='actions';box.style.margin='0';box.innerHTML='<button onclick="backupProgress()">Backup progres</button><button onclick="importProgress()">Impor progres</button>';actions.append(box)}};window.addEventListener('storage',e=>{if(e.key===KEY){state=load();render()}});render();
</script></html>
