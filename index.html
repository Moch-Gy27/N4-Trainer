const words=data.split('§').map((x,i)=>{let [g,l,k,r,m]=x.split('|');return{id:i,g,l:+l,k,r,m,kanji:k!==r}});const dirs={ka:['Kanji → Arti','m',w=>w.k,w=>'Baca: '+w.r,1,true],ra:['Bunyi → Arti','m',w=>w.r,w=>'Pilih arti yang tepat',.9,false],kr:['Kanji → Hiragana','r',w=>w.k,w=>'Pilih cara baca yang tepat',1.1,true],rk:['Hiragana → Kanji','k',w=>w.r,w=>'Pilih tulisan Jepang yang tepat',1.3,true],mr:['Arti → Hiragana','r',w=>cap(w.m),w=>'Pilih cara baca yang tepat',1.4,false],mk:['Arti → Kanji','k',w=>cap(w.m),w=>'Pilih tulisan Jepang yang tepat',1.6,true]};const SESSION_MS=120000,KEY='kotoba-path-v1';let state=load(),run,tickId;function cap(s){return s[0].toUpperCase()+s.slice(1)}function load(){try{return{r:{},sess:{},today:{},...JSON.parse(localStorage.getItem(KEY))}}catch{return{r:{},sess:{},today:{}}}}function save(){localStorage.setItem(KEY,JSON.stringify(state))}function date(){let d=new Date;return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}function R(key){return state.r[key]||(state.r[key]={n:0,c:0,t:0,m:0,st:0,due:0})}function gradeWords(g){return words.filter(w=>w.g===g)}function available(w,d){return !dirs[d][5]||w.kanji}function gradeM(g){let a=gradeWords(g).flatMap(w=>Object.keys(dirs).filter(d=>available(w,d)).map(d=>state.r[w.id+'|'+d]?.m||0));return a.reduce((x,y)=>x+y,0)/a.length}function gradeN(g){return gradeWords(g).flatMap(w=>Object.keys(dirs).filter(d=>available(w,d)&&state.r[w.id+'|'+d])).filter(Boolean).length}function gradeCoverage(g){let ws=gradeWords(g);return ws.length?ws.filter(w=>Object.keys(dirs).some(d=>state.r[w.id+'|'+d]?.n)).length/ws.length*100:0}function gate(i){return i<8?{mastery:45,answers:6,coverage:60}:{mastery:65,answers:12,coverage:70}}function unlocked(){let n=0;for(let i=0;i<grades.length-1;i++){let g=gate(i);if(gradeM(grades[i])>=g.mastery&&gradeN(grades[i])>=g.answers&&gradeCoverage(grades[i])>=g.coverage)n=i+1;else break}return n}function current(){return grades[unlocked()]}function sess(t){return state.sess[date()]?.[t]}

const kanjiDirs={kr:['Kanji → Cara baca','r',x=>x.k,'Pilih cara baca yang tepat'],ka:['Kanji → Arti','m',x=>x.k,'Pilih arti yang tepat'],mk:['Arti → Kanji','k',x=>cap(x.m),'Pilih kanji yang tepat']};

function KS(){return state.kanji||(state.kanji={r:{},sess:{},today:{}})}function KR(key){let s=KS();return s.r[key]||(s.r[key]={n:0,c:0,t:0,m:0,st:0,due:0})}function kWords(g){return kanjiWords.filter(x=>x.g===g)}function kM(g){let a=kWords(g).flatMap(x=>Object.keys(kanjiDirs).map(d=>KS().r[x.id+'|'+d]?.m||0));return a.length?a.reduce((n,v)=>n+v,0)/a.length:0}function kN(g){return kWords(g).flatMap(x=>Object.keys(kanjiDirs).filter(d=>KS().r[x.id+'|'+d])).length}function kCoverage(g){let a=kWords(g);return a.length?a.filter(x=>Object.keys(kanjiDirs).some(d=>KS().r[x.id+'|'+d]?.n)).length/a.length*100:0}function kGate(i){return i<8?{mastery:45,answers:6,coverage:60}:{mastery:65,answers:12,coverage:70}}function kUnlocked(){let n=0;for(let i=0;i<grades.length-1;i++){let q=kGate(i);if(kM(grades[i])>=q.mastery&&kN(grades[i])>=q.answers&&kCoverage(grades[i])>=q.coverage)n=i+1;else break}return n}function kCurrent(){return grades[kUnlocked()]}function kSess(t){return KS().sess[date()]?.[t]}function kWordM(x){let a=Object.keys(kanjiDirs).map(d=>KS().r[x.id+'|'+d]).filter(Boolean);return a.length?Math.round(a.reduce((n,v)=>n+v.m,0)/a.length):0}
function renderKanji(){let u=kUnlocked(),c=kCurrent(),s=KS(),order=['pagi','siang','malam'],next=order.findIndex(t=>!kSess(t));if(next<0)next=0;let g=kanjiListGrade||c,rows=kWords(g).map(x=>`<tr><td>${x.level}</td><td><b class="word">${x.k}</b>${x.basic&&x.basic!==x.k?`<br><small>dasar: ${x.basic}</small>`:''}</td><td>${x.r}</td><td>${x.m}</td><td><b>${kWordM(x)}%</b><div class="bar"><i style="width:${kWordM(x)}%"></i></div></td></tr>`).join('');app.innerHTML=`<div class="head"><button class="menu-toggle" title="Menu" onclick="openMenu()">☰</button><div><h1>Kanji <span style="color:#3867ff">Path</span></h1><p class="sub">Kanji dipisah dari Kotoba · 3 sesi belajar × 15 menit.</p></div><button onclick="resetKanji()">Reset progres Kanji</button></div><div class="grid"><section class="card"><span class="tag">Grade aktif: ${c}</span><h2 style="margin:10px 0 0">Hafalkan kanji secara bertahap.</h2><p class="sub">Mastery per arah: kanji→baca, kanji→arti, dan arti→kanji.</p><div class="sessions">${[['pagi','🌅 Kanji baru'],['siang','☀️ Review grade sebelumnya'],['malam','🌙 Campuran pagi + siang']].map(([t,n],i)=>`<div class="session ${kSess(t)?'done':''}"><b>${n}</b><small>${kSess(t)?'✓ '+kSess(t).q+' soal · '+kSess(t).a+'%':'15 menit'}</small><button class="${i===next?'primary':''}" style="margin-top:9px;width:100%" onclick="startKanji('${t}')">${kSess(t)?'Ulang':'Kerjakan'}</button></div>`).join('')}</div></section><aside class="card"><h2>Progress Kanji</h2><div class="stats"><div class="stat"><b>${Math.round(kM(c))}%</b><small>mastery ${c}</small></div><div class="stat"><b>${Object.values(s.r).reduce((a,x)=>a+x.n,0)}</b><small>jawaban</small></div><div class="stat"><b>${Object.values(s.r).filter(x=>x.due&&x.due<Date.now()).length}</b><small>review jatuh tempo</small></div></div><p class="sub" style="margin-top:15px">Pagi belajar grade aktif; siang review grade sebelumnya; malam mencampurkan kartu hari ini.</p></aside></div><section class="card" style="margin-top:15px"><h2>Jalur grade Kanji</h2><div class="grades">${grades.map((x,i)=>`<button class="grade ${i===u?'now':''} ${i>u?'lock':''}" ${i>u?'disabled':''}><b>${x} ${i>u?'🔒':''}</b><small>${kWords(x).length} entri</small><div class="bar"><i style="width:${Math.round(kM(x))}%"></i></div><small>${Math.round(kM(x))}%</small></button>`).join('')}</div></section><section class="card" style="margin-top:15px"><div class="head"><div><h2 style="margin:0">Daftar Kanji & progres</h2><p class="sub" style="margin:4px 0 0">Kanji dasar dan kanji terapan dari file Shiken.</p></div><select onchange="kanjiListGrade=this.value;render()">${grades.map(x=>`<option ${x===g?'selected':''}>${x}</option>`).join('')}</select></div><div class="tablewrap"><table><thead><tr><th>Level</th><th>Kanji</th><th>Cara baca</th><th>Arti</th><th>Mastery</th></tr></thead><tbody>${rows}</tbody></table></div></section>`}
function kAll(){return kanjiWords.flatMap(x=>Object.keys(kanjiDirs).map(d=>({x,d,r:KS().r[x.id+'|'+d]})))}function kScore(q,n){let r=q.r||{},late=Math.max(0,n-(r.due||n))/36e5;return(100-(r.m||0))*2+late*8+Math.random()*10}function kCards(t){let ci=kUnlocked(),now=Date.now(),pool;if(t==='pagi')pool=kAll().filter(q=>q.x.g===kCurrent());else if(t==='siang'){pool=kAll().filter(q=>grades.indexOf(q.x.g)<ci);if(!pool.length)pool=kAll().filter(q=>q.x.g===kCurrent()&&q.r?.n)}else{let ids=Object.values(KS().today[date()]||{}).flat();pool=ids.map(z=>{let [id,d]=z.split('|'),x=kanjiWords.find(w=>w.id===+id);return x&&{x,d,r:KS().r[z]}}).filter(Boolean);if(!pool.length)pool=kAll().filter(q=>grades.indexOf(q.x.g)<=ci)}let a=pool.filter(q=>!(q.r?.m>=100&&q.r.due>now));if(a.length)pool=a;a=pool.filter(q=>!q.r?.hold||q.r.hold<=now);if(a.length)pool=a;let due=pool.filter(q=>q.r?.due<=now),fresh=pool.filter(q=>!q.r?.n);return(due.length&&(t==='siang'||Math.random()<.45)?due:fresh.length?fresh:pool).sort((a,b)=>kScore(b,now)-kScore(a,now))}

function answerKanji(ok,btn){let q=kanjiRun.q0,ms=Math.round(performance.now()-kanjiRun.shown),key=q.x.id+'|'+q.d,r=KR(key),foundation=grades.indexOf(q.x.g)<8,mastered=ok&&ms<(foundation?5000:2000),fast=ok&&ms<5000;r.n++;r.c+=+ok;r.t+=ms;r.st=ok?r.st+1:0;r.m=mastered?100:ok?Math.round(Math.min(100,r.m*(fast?.68:.78)+(fast?32:18))):Math.round(r.m*.62);let ds=[.25,1,3,7,14,30];r.due=mastered?Date.now()+30*864e5:Date.now()+(ok?ds[Math.min(r.st-1,5)]*864e5*(fast?1.8:.65):300000);r.hold=ok?0:kanjiRun.end;kanjiRun.q++;kanjiRun.c+=+ok;kanjiRun.seen.push(key);document.querySelectorAll('#panel .choice').forEach(b=>{b.disabled=true;if(b.textContent.endsWith(q.x[kanjiDirs[q.d][1]]))b.classList.add('good')});if(!ok)btn.classList.add('bad');kfb.className='feedback show '+(ok?'good':'bad');kfb.innerHTML=`<b>${ok?'✓ Benar':'✕ Belum tepat'}</b><br>${q.x.k}（${q.x.r}）= ${q.x.m}<br><small>${(ms/1000).toFixed(1)} dtk · ${mastered?'Mastery langsung; review 30 hari.':ok?'Progress naik; SRS disesuaikan.':'Masuk antrean review berikutnya.'}</small>`;knx.className='primary next show';save()}
function finishKanji(){if(!kanjiRun)return;clearInterval(kanjiTick);let s=KS(),d=date();s.sess[d]??={};s.sess[d][kanjiRun.type]={q:kanjiRun.q,a:kanjiRun.q?Math.round(kanjiRun.c/kanjiRun.q*100):0};s.today[d]??={};s.today[d][kanjiRun.type]=[...new Set(kanjiRun.seen)];let night=kanjiRun.type==='malam';save();let out={...kanjiRun};kanjiRun=null;if(night){s.sess[d]={};s.today[d]={};save()}panel.innerHTML=`<div class="study"><section class="card q"><span class="tag">Sesi Kanji tercatat</span><h1 style="margin-top:16px">${out.q} soal · ${out.q?Math.round(out.c/out.q*100):0}% benar</h1><p class="sub">Progress Kanji dan prioritas review sudah diperbarui.</p><button class="primary" onclick="closePanel()">Kembali ke dashboard</button></section></div>`}function resetKanji(){if(confirm('Hapus semua progres Kanji di browser ini?')){delete state.kanji;save();render()}}

function n4ChoiceDistractors(pi,li,correct){let own=N4_TARGETS[`${pi}-${li}`]||[],pool=[];N4_PARTS.forEach((p,pj)=>p.lessons.forEach((l,lj)=>{if(pj!==pi||lj!==li)pool.push(...n4Questions(l,pj,lj))}));let clean=[...new Set(pool.filter(x=>x!==correct&&!own.some(t=>x.includes(t))))].sort(()=>Math.random()-.5);if(clean.length<3)clean=[...new Set(pool.filter(x=>x!==correct))].sort(()=>Math.random()-.5);return clean.slice(0,3)}
function n4BlankData(sentence,pi,li){let own=(N4_TARGETS[`${pi}-${li}`]||[]).filter(x=>sentence.includes(x)).sort((a,b)=>b.length-a.length),answer=own[0];if(!answer){let chunks=n4Tokens(sentence).filter(x=>!/[、。！？]/.test(x));answer=chunks[chunks.length-1]}let question=sentence.replace(answer,'___'),pool=Object.values(N4_TARGETS).flat().filter(x=>x!==answer&&!sentence.includes(x)),opts=[answer,...[...new Set(pool)].sort(()=>Math.random()-.5).slice(0,3)].sort(()=>Math.random()-.5);return{answer,question,opts}}
function n4Next(){let r=n4Run,l=N4_PARTS[r.pi].lessons[r.li],pool=n4Questions(l,r.pi,r.li),left=pool.map((_,i)=>i).filter(i=>!r.seen.includes(i));if(r.q>=5||!left.length)return n4Finish();let si=left[Math.floor(Math.random()*left.length)],sentence=pool[si],kind=r.q%3;r.seen.push(si);r.q++;let body='';if(kind===0){let opts=[{v:sentence,ok:true},...n4ChoiceDistractors(r.pi,r.li,sentence).map(v=>({v,ok:false}))].sort(()=>Math.random()-.5);body=`<h2>Pilih kalimat yang memakai pola “${n4Text(l.title)}” dengan tepat.</h2><div class="choices">${opts.map((o,i)=>`<button class="choice" onclick="n4Answer(${o.ok},this)">${'ABCD'[i]}. ${n4Text(o.v)}。</button>`).join('')}</div>`}else if(kind===1){let blank=n4BlankData(sentence,r.pi,r.li);body=`<h2>Lengkapi inti polanya.</h2><div class="formula">${n4Text(blank.question)}。</div><div class="choices">${blank.opts.map((o,i)=>`<button class="choice" onclick="n4Answer(${o===blank.answer},this)">${'ABCD'[i]}. ${n4Text(o)}</button>`).join('')}</div>`}else{let toks=n4Tokens(sentence).filter(x=>!/[。！？]/.test(x));r.arr=[];r.arrAnswer=toks.join('');body=`<h2>Susun kalimat yang benar.</h2><p class="sub">Kotoba dan partikel dipisah.</p><div class="arrange">${[...toks].sort(()=>Math.random()-.5).map(t=>`<button class="token" onclick='n4Add(this,${JSON.stringify(t)})'>${n4Text(t)}</button>`).join('')}</div><div id="n4out" class="formula"></div><button id="n4check" class="primary" onclick="n4Check(this)">Cek jawaban</button>`}n4Panel.innerHTML=`<div class="bun-material"><div class="top"><button onclick="n4Material(${r.pi},${r.li})">← Materi</button><span class="tag">Latihan Bunpou N4 · ${r.q}/5</span></div><section class="card q"><span class="tag">Bagian ${r.pi+1} · ${n4Text(l.title)}</span>${body}<div id="n4fb" class="feedback"></div><button id="n4next" class="primary next" onclick="n4Next()">Soal berikutnya →</button></section></div>`;n4Panel.classList.toggle('furigana-off',!furiganaEnabled())}

function n4Add(btn,t){if(btn.disabled)return;btn.disabled=true;n4Run.arr.push(t);document.getElementById('n4out').innerHTML=n4Text(n4Run.arr.join(''))}
function n4Check(btn){n4Answer(n4Run.arr.join('')===n4Run.arrAnswer,btn)}
function n4Answer(ok,btn){if(btn.dataset.done)return;btn.dataset.done='1';let r=n4Rec(n4Run.pi,n4Run.li);r.n++;if(ok){r.c++;n4Run.c++;r.m=Math.min(100,r.m+20);btn.classList.add('correct')}else{r.m=Math.max(0,r.m-8);btn.classList.add('wrong')}save();document.getElementById('n4fb').textContent=ok?'✓ Benar. Lanjut ke kalimat berikutnya.':'Belum tepat. Jawaban ini baru akan diuji lagi pada putaran berikutnya.';document.getElementById('n4next').style.display='block'}
function n4Finish(){let r=n4Run;n4Panel.innerHTML=`<div class="bun-material"><section class="card q"><span class="tag">Pelajaran selesai</span><h1>${r.c}/5 benar</h1><p class="sub">Lima soal khusus pola ini sudah tercatat. Jawaban salah tidak langsung diulang dalam putaran yang sama.</p><button class="primary" onclick="n4Material(${r.pi},${r.li})">Kembali ke materi</button></section></div>`;n4Run=null}
const n4Menu=openMenu;openMenu=function(){n4Menu();let n=menuPanel.querySelector('.side-menu');if(n&&!n.querySelector('.n4-option'))n.insertAdjacentHTML('beforeend','<button class="nav-item n4-option" onclick="goBunpouN4()"><b>✏️ Bunpou N4</b><small>Materi pola & latihan kalimat</small></button>')};

const renderCopyFix=render;render=function(){renderCopyFix();let u=unlocked(),g=gate(u),active=current();let dashCopy=document.querySelector('.grid section.card .sub');if(dashCopy)dashCopy.textContent=`Buka grade selanjutnya saat mastery ${active} mencapai ${g.mastery}% dengan minimal ${g.answers} arah kartu dan cakupan ${g.coverage}% kotoba.`;let subs=document.querySelectorAll('.head .sub');if(subs.length)subs[subs.length-1].textContent='3 sesi belajar × 15 menit · kotoba, kanji, dan bunpou · tanpa tombol self-rating.';let countdown=document.querySelector('.card .head h2');if(countdown)countdown.remove()};render();
</script></html>
