<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>N4 Auto Trainer</title>
  <style>
    :root{--bg:#f5f7fb;--ink:#172033;--muted:#65708a;--card:#fff;--blue:#3867ff;--green:#168a63;--red:#d74457;--amber:#d98b10;--line:#e6eaf2}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}.shell{max-width:900px;margin:auto;padding:26px 18px 48px}header{display:flex;align-items:start;justify-content:space-between;gap:16px;margin-bottom:20px}h1{font-size:clamp(1.45rem,4vw,2.1rem);margin:0}h1 span{color:var(--blue)}.sub{margin:5px 0 0;color:var(--muted)}button{font:inherit;cursor:pointer;border:0}.reset{background:transparent;border:1px solid var(--line);border-radius:10px;padding:9px 12px;color:var(--muted)}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:0 8px 26px #26385f0a}.trainer{padding:28px}.mode-switch{display:flex;gap:8px;margin-bottom:18px}.mode{padding:8px 11px;border-radius:9px;background:#f1f3f8;color:var(--muted);font-size:.85rem}.mode.active{background:#e7edff;color:#3157d1;font-weight:700}.meta{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-size:.92rem}.pill{background:#edf1ff;color:#3157d1;border-radius:999px;padding:4px 10px;font-weight:650}.prompt{font-size:clamp(2.25rem,9vw,4.8rem);font-weight:750;text-align:center;margin:34px 0 8px;letter-spacing:.02em}.hint{text-align:center;color:var(--muted);min-height:25px}.choices{display:grid;gap:10px;margin-top:28px}.choice{width:100%;padding:16px 18px;text-align:left;border:1.5px solid var(--line);border-radius:13px;background:#fff;color:var(--ink);transition:.15s}.choice:hover:not(:disabled){border-color:#91aaff;background:#f6f8ff}.choice:disabled{cursor:default}.choice.correct{border-color:var(--green);background:#ebfaf4}.choice.wrong{border-color:var(--red);background:#fff0f2}.letter{display:inline-grid;place-items:center;width:27px;height:27px;border-radius:8px;background:#f0f2f7;color:var(--muted);font-size:.82rem;font-weight:700;margin-right:10px}.feedback{display:none;margin-top:22px;padding:15px;border-radius:12px}.feedback.show{display:block}.feedback.good{background:#ebfaf4;color:#096346}.feedback.bad{background:#fff0f2;color:#a3263b}.next{display:none;margin-top:14px;width:100%;padding:14px;border-radius:12px;background:var(--blue);color:white;font-weight:700}.next.show{display:block}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:20px 0}.stat{padding:16px}.stat b{display:block;font-size:1.4rem}.stat small{color:var(--muted)}.dashboard{padding:22px}.dashboard h2{font-size:1.05rem;margin:0 0 14px}.direction{display:grid;grid-template-columns:1fr auto auto;gap:10px;padding:12px 0;border-top:1px solid var(--line);align-items:center}.direction:first-of-type{border-top:0}.bar{height:8px;width:110px;background:#eef0f5;border-radius:99px;overflow:hidden}.bar i{height:100%;display:block;background:var(--blue);border-radius:99px}.pct{font-variant-numeric:tabular-nums;min-width:38px;text-align:right}.weak{margin-top:18px;color:var(--muted);font-size:.9rem}.empty{font-size:.92rem;color:var(--muted);padding:14px 0}@media(max-width:590px){.shell{padding:18px 12px}.trainer{padding:22px 16px}.stats{grid-template-columns:repeat(2,1fr)}header{display:block}.reset{margin-top:16px}.bar{width:82px}}
  </style>
</head>
<body>
<main class="shell">
  <header><div><h1>N4 <span>Auto Trainer</span></h1><p class="sub">Pilihan ganda • arti, bunyi, dan kanji • progress tersimpan di laptop</p></div><button class="reset" id="reset">Reset progress</button></header>
  <section class="card trainer">
    <div class="mode-switch"><button class="mode active" data-mode="normal">Dosis Normal · 3 arah</button><button class="mode" data-mode="high">Dosis Tinggi · 6 arah</button></div>
    <div class="meta"><span class="pill" id="direction">Memuat…</span><span id="timer">0.0 dtk</span></div>
    <div class="prompt" id="prompt"></div><div class="hint" id="hint"></div>
    <div class="choices" id="choices"></div><div id="feedback" class="feedback"></div><button id="next" class="next">Soal berikutnya →</button>
  </section>
  <section class="stats" id="stats"></section>
  <section class="card dashboard"><h2>Penguasaan per arah</h2><div id="directions"></div><div class="weak" id="weak"></div></section>
</main>
<script>
// Tambahkan kata baru di sini. Data disimpan per kata dan per arah latihan.
const words=[
['食べる','たべる','makan'],['飲む','のむ','minum'],['見る','みる','melihat'],['聞く','きく','mendengar'],['読む','よむ','membaca'],['書く','かく','menulis'],['買う','かう','membeli'],['行く','いく','pergi'],['来る','くる','datang'],['帰る','かえる','pulang'],['会う','あう','bertemu'],['話す','はなす','berbicara'],['使う','つかう','menggunakan'],['作る','つくる','membuat'],['持つ','もつ','membawa'],['待つ','まつ','menunggu'],['知る','しる','mengetahui'],['教える','おしえる','mengajar'],['覚える','おぼえる','mengingat'],['忘れる','わすれる','lupa'],['始める','はじめる','memulai'],['終わる','おわる','selesai'],['働く','はたらく','bekerja'],['休む','やすむ','beristirahat'],['寝る','ねる','tidur'],['起きる','おきる','bangun'],['急ぐ','いそぐ','bergegas'],['借りる','かりる','meminjam'],['返す','かえす','mengembalikan'],['開ける','あける','membuka'],['閉める','しめる','menutup'],['入る','はいる','masuk'],['出る','でる','keluar'],['立つ','たつ','berdiri'],['座る','すわる','duduk'],['歩く','あるく','berjalan'],['走る','はしる','berlari'],['高い','たかい','mahal / tinggi'],['安い','やすい','murah'],['新しい','あたらしい','baru'],['古い','ふるい','lama / tua'],['大きい','おおきい','besar'],['小さい','ちいさい','kecil'],['忙しい','いそがしい','sibuk'],['楽しい','たのしい','menyenangkan'],['難しい','むずかしい','sulit'],['簡単','かんたん','mudah / sederhana'],['大切','たいせつ','penting'],['必要','ひつよう','perlu'],['有名','ゆうめい','terkenal'],['時間','じかん','waktu'],['会社','かいしゃ','perusahaan'],['仕事','しごと','pekerjaan'],['勉強','べんきょう','belajar'],['学校','がっこう','sekolah'],['病院','びょういん','rumah sakit'],['駅','えき','stasiun'],['天気','てんき','cuaca'],['旅行','りょこう','perjalanan'],['約束','やくそく','janji']
].map((w,i)=>({id:'n4-'+i,kanji:w[0],reading:w[1],meaning:w[2]}));
const DIR={
  kanjiMeaning:{name:'Kanji → Arti',prompt:w=>w.kanji,hint:w=>'Baca: '+w.reading,answer:w=>w.meaning,field:'meaning'},
  readingMeaning:{name:'Bunyi → Arti',prompt:w=>w.reading,hint:()=> 'Pilih arti yang tepat',answer:w=>w.meaning,field:'meaning'},
  meaningKanji:{name:'Arti → Kanji',prompt:w=>title(w.meaning),hint:w=>'Pilih tulisan Jepang yang tepat',answer:w=>w.kanji,field:'kanji'},
  kanjiReading:{name:'Kanji → Hiragana',prompt:w=>w.kanji,hint:()=> 'Pilih cara baca yang tepat',answer:w=>w.reading,field:'reading'},
  readingKanji:{name:'Hiragana → Kanji',prompt:w=>w.reading,hint:()=> 'Pilih kanji yang tepat',answer:w=>w.kanji,field:'kanji'},
  meaningReading:{name:'Arti → Hiragana',prompt:w=>title(w.meaning),hint:()=> 'Pilih cara baca yang tepat',answer:w=>w.reading,field:'reading'}
};
const MODES={normal:['kanjiMeaning','readingMeaning','meaningKanji'],high:Object.keys(DIR)};
const KEY='n4-auto-trainer-v3';let state=load(),current=null,shownAt=0,tick=null;
function title(s){return s.charAt(0).toUpperCase()+s.slice(1)}
function load(){try{let current=JSON.parse(localStorage.getItem(KEY));if(current)return current;let old=JSON.parse(localStorage.getItem('n4-auto-trainer-v2'));if(old){let aliases={meaning:'kanjiMeaning',sound:'readingMeaning',kanji:'meaningKanji'},reviews={};Object.entries(old.reviews||{}).forEach(([k,v])=>{let [id,d]=k.split('|');if(aliases[d])reviews[id+'|'+aliases[d]]={...v,lastSeen:0}});return{reviews,answered:old.answered||0,correct:old.correct||0,totalTime:old.totalTime||0,mode:'normal'}}return{reviews:{},answered:0,correct:0,totalTime:0,mode:'normal'}}catch{return{reviews:{},answered:0,correct:0,totalTime:0,mode:'normal'}}}
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function key(word,dir){return word.id+'|'+dir}
function getReview(word,dir){return state.reviews[key(word,dir)]}
function review(word,dir){let k=key(word,dir);if(!state.reviews[k])state.reviews[k]={attempts:0,correct:0,totalTime:0,mastery:0,nextReview:0,streak:0,lastSeen:0};return state.reviews[k]}
function activeDirections(){return MODES[state.mode]}
function chooseQuestion(){
  let now=Date.now(), all=[]; words.forEach(w=>activeDirections().forEach(d=>{let r=getReview(w,d);all.push({w,d,r})}));
  let due=all.filter(x=>x.r&&x.r.attempts&&x.r.nextReview<=now);
  let fresh=all.filter(x=>!x.r||!x.r.attempts);
  // Sekitar seperempat soal adalah review lama yang memang sudah jatuh tempo.
  let pool=(due.length&&(Math.random()<.25||!fresh.length))?due:fresh.length?fresh:due;
  // Bila seluruh kartu belum jatuh tempo, latihan tambahan tetap mungkin, namun yang paling lemah dipilih.
  if(!pool.length)pool=all.filter(x=>x.r).sort((a,b)=>(a.r.mastery-b.r.mastery)||(a.r.nextReview-b.r.nextReview)).slice(0,12);
  pool.sort((a,b)=>{let ar=a.r?Math.max(0,now-a.r.nextReview)/3600000:0,br=b.r?Math.max(0,now-b.r.nextReview)/3600000:0;return (br*4+(100-(b.r?.mastery||0))+Math.random()*8)-(ar*4+(100-(a.r?.mastery||0))+Math.random()*8)});
  return pool[0]
}
function randomChoices(word,dir){let field=DIR[dir].field;let candidates=words.filter(w=>w.id!==word.id&&w[field]!==word[field]).sort(()=>Math.random()-.5).slice(0,3);return [word,...candidates].sort(()=>Math.random()-.5).map(w=>({text:w[field],correct:w.id===word.id}))}
function newQuestion(){current=chooseQuestion();let d=DIR[current.d];document.querySelector('#direction').textContent=d.name;document.querySelector('#prompt').textContent=d.prompt(current.w);document.querySelector('#hint').textContent=d.hint(current.w);let choices=document.querySelector('#choices');choices.innerHTML='';randomChoices(current.w,current.d).forEach((c,i)=>{let b=document.createElement('button');b.className='choice';b.innerHTML='<span class="letter">'+String.fromCharCode(65+i)+'</span>'+c.text;b.onclick=()=>answer(c.correct,b);choices.append(b)});document.querySelector('#feedback').className='feedback';document.querySelector('#next').className='next';shownAt=performance.now();clearInterval(tick);tick=setInterval(()=>document.querySelector('#timer').textContent=((performance.now()-shownAt)/1000).toFixed(1)+' dtk',100)}
function schedule(r,correct,elapsed){let speed=Math.max(0,Math.min(1,(10000-elapsed)/8000));let quality=correct?.65+.35*speed:0;r.streak=correct?r.streak+1:0;r.mastery=correct?Math.round(Math.min(100,r.mastery*.7+quality*100*.3)):Math.round(r.mastery*.7);let stages=[.5,1,3,7,14,19];let days=stages[Math.min(stages.length-1,Math.max(0,r.streak-1))];if(correct&&speed<.3)days*=.55;return correct?days*86400000:5*60000}
function answer(correct,chosen){let elapsed=Math.round(performance.now()-shownAt);clearInterval(tick);document.querySelector('#timer').textContent=(elapsed/1000).toFixed(1)+' dtk';let r=review(current.w,current.d);r.attempts++;r.correct+=+correct;r.totalTime+=elapsed;r.lastSeen=Date.now();r.nextReview=Date.now()+schedule(r,correct,elapsed);state.answered++;state.correct+=+correct;state.totalTime+=elapsed;save();document.querySelectorAll('.choice').forEach(b=>{b.disabled=true;if(b.textContent.trim().endsWith(DIR[current.d].answer(current.w)))b.classList.add('correct')});if(!correct)chosen.classList.add('wrong');let fb=document.querySelector('#feedback');fb.className='feedback show '+(correct?'good':'bad');let next=correct?relative(r.nextReview):'±5 menit';fb.innerHTML=(correct?'✓ Benar':'✕ Belum tepat')+' — <b>'+current.w.kanji+'</b>（'+current.w.reading+'） = '+current.w.meaning+'<br><small>Waktu respons: '+(elapsed/1000).toFixed(1)+' detik · Review berikutnya: '+next+'. '+(correct?'Jawaban cepat mendapat interval lebih panjang.':'Kartu ini diprioritaskan untuk pengulangan cepat.')+'</small>';document.querySelector('#next').className='next show';renderStats()}
function relative(time){let h=(time-Date.now())/3600000;return h<24?'±'+Math.round(h)+' jam':'±'+Math.round(h/24)+' hari'}
function renderStats(){let acc=state.answered?Math.round(state.correct/state.answered*100):0,avg=state.answered?(state.totalTime/state.answered/1000).toFixed(1):'—',due=Object.values(state.reviews).filter(r=>r.attempts&&r.nextReview<=Date.now()).length;document.querySelector('#stats').innerHTML=[['Dijawab',state.answered],['Akurasi',acc+'%'],['Rata-rata waktu',avg+(avg==='—'?'':' dtk')],['Review jatuh tempo',due]].map(x=>'<div class="card stat"><b>'+x[1]+'</b><small>'+x[0]+'</small></div>').join('');document.querySelector('#directions').innerHTML=activeDirections().map(d=>{let x=DIR[d],rs=words.map(w=>getReview(w,d)).filter(Boolean),attempts=rs.reduce((n,r)=>n+r.attempts,0),m=rs.length?Math.round(rs.reduce((n,r)=>n+r.mastery,0)/rs.length):0;return '<div class="direction"><div><b>'+x.name+'</b><br><small>'+attempts+' jawaban</small></div><div class="bar"><i style="width:'+m+'%"></i></div><span class="pct">'+m+'%</span></div>'}).join('');let weak=words.map(w=>{let rs=activeDirections().map(d=>getReview(w,d)).filter(Boolean);return{w,m:rs.length?Math.round(rs.reduce((a,r)=>a+r.mastery,0)/rs.length):0}}).filter(x=>x.m>0).sort((a,b)=>a.m-b.m).slice(0,4);document.querySelector('#weak').innerHTML=weak.length?'Perlu diperkuat: <b>'+weak.map(x=>x.w.kanji+' ('+x.m+'%)').join(' · ')+'</b>':'Jawab beberapa soal untuk melihat kata yang perlu diperkuat.';document.querySelectorAll('.mode').forEach(b=>b.classList.toggle('active',b.dataset.mode===state.mode))}
document.querySelector('#next').onclick=()=>{newQuestion();renderStats()};document.querySelectorAll('.mode').forEach(b=>b.onclick=()=>{state.mode=b.dataset.mode;save();newQuestion();renderStats()});document.querySelector('#reset').onclick=()=>{if(confirm('Hapus semua progress latihan dari browser ini?')){localStorage.removeItem(KEY);state=load();newQuestion();renderStats()}};newQuestion();renderStats();
</script>
</body>
</html>
