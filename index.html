const DIR={km:{name:'Kanji → Arti',field:'meaning',p:w=>w.kanji,h:w=>'Baca: '+w.reading,weight:1,requiresKanji:true},rm:{name:'Bunyi → Arti',field:'meaning',p:w=>w.reading,h:()=> 'Pilih arti yang tepat',weight:.9},kr:{name:'Kanji → Hiragana',field:'reading',p:w=>w.kanji,h:()=> 'Pilih cara baca yang tepat',weight:1.1,requiresKanji:true},rk:{name:'Hiragana → Kanji',field:'kanji',p:w=>w.reading,h:()=> 'Pilih tulisan Jepang yang tepat',weight:1.3,requiresKanji:true},mr:{name:'Arti → Hiragana',field:'reading',p:w=>cap(w.meaning),h:()=> 'Pilih cara baca yang tepat',weight:1.4},mk:{name:'Arti → Kanji',field:'kanji',p:w=>cap(w.meaning),h:()=> 'Pilih tulisan Jepang yang tepat',weight:1.6,requiresKanji:true}};
const KEY='n4-trainer-local-v1';let state=load(),activeGrade='C1',run=null,timer=null;function cap(s){return s[0].toUpperCase()+s.slice(1)}function load(){try{return {...{records:{},grammar:{},sessions:{},answered:0,correct:0,totalTime:0},...JSON.parse(localStorage.getItem(KEY))}}catch{return{records:{},grammar:{},sessions:{},answered:0,correct:0,totalTime:0}}}function save(){localStorage.setItem(KEY,JSON.stringify(state))}function day(){let d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}function sessionStatus(name){return state.sessions[day()]?.[name]}function rec(k){return state.records[k]||(state.records[k]={n:0,c:0,t:0,streak:0,mastery:0,due:0})}function grammarRec(k){return state.grammar[k]||(state.grammar[k]={n:0,c:0,t:0,mastery:0,due:0,streak:0})}function dueCount(){return [...Object.values(state.records),...Object.values(state.grammar)].filter(r=>r.due&&r.due<Date.now()).length}function accuracy(){return state.answered?Math.round(state.correct/state.answered*100):0}function avg(){return state.answered?(state.totalTime/state.answered/1000).toFixed(1):'—'}
function renderHome(){let done=['pagi','siang','malam'].filter(sessionStatus).length,ix=['C1','C2','C3','C4','D1','D2','D3','D4'].indexOf(activeGrade);home.innerHTML=`<header><div><h1>N4 <b>Trainer</b></h1><p class="subtitle">Belajar lokal · data tersimpan di browser laptop ini</p></div><div class="top-actions"><button class="ghost" onclick="exportData()">Backup data</button><button class="ghost" onclick="resetData()">Reset</button></div></header><section class="dashboard"><div class="card hero"><span class="tag">Target hari ini</span><h2>3 sesi × 15 menit</h2><div class="daily">${done}/3 <span class="muted" style="font-size:1rem">sesi selesai</span></div><div class="session-grid">${[['pagi','🌅 Core'],['siang','☀️ Review'],['malam','🌙 Exam']].map(([k,n])=>`<div class="session ${sessionStatus(k)?'done':''}"><b>${n}</b><small>${sessionStatus(k)?'✓ '+sessionStatus(k).q+' soal · '+sessionStatus(k).acc+'%':'15 menit'}</small></div>`).join('')}</div><div class="actions"><button class="primary" onclick="startSession('pagi')">Mulai Core</button><button onclick="startSession('siang')">Review SRS</button><button onclick="startSession('malam')">Exam practice</button></div></div><aside class="card summary"><h2>Ringkasan</h2><div class="metrics"><div class="metric"><b>${state.answered}</b><small>jawaban</small></div><div class="metric"><b>${accuracy()}%</b><small>akurasi</small></div><div class="metric"><b>${avg()} dtk</b><small>rata-rata</small></div></div><p class="muted">${dueCount()?dueCount()+' review jatuh tempo. Sistem memprioritaskannya.':'Belum ada review jatuh tempo.'}</p></aside></section><section class="card curriculum"><h2>Kurikulum N4 — mokuhyō</h2><div class="grades">${['C1','C2','C3','C4','D1','D2','D3','D4'].map((g,i)=>`<button class="grade ${activeGrade===g?'active':''}" onclick="activeGrade='${g}';renderHome()"><b>${g}</b><small>N4 L${i*3+1}–${i*3+3}</small></button>`).join('')}</div><div class="lesson-list">${objectives.slice(ix*3,ix*3+3).map((o,j)=>`<button class="lesson" onclick="showLesson(${ix*3+j+1})"><b>Lesson ${ix*3+j+1} <span class="dots">${Math.round(lessonMastery(ix*3+j+1))}%</span></b><small>${o[0]}<br>${o[1]}<br><b style="color:#3867ff">Materi + 3 tipe soal →</b></small></button>`).join('')}</div></section><section class="card review-list" id="progress"></section>`;showProgress()}function lessonMastery(l){let rs=[...Object.entries(state.records).filter(([k])=>words.find(w=>k.startsWith(w.id+'|'))?.lesson===l).map(x=>x[1]),...Object.entries(state.grammar).filter(([k])=>k.startsWith(l+'|')).map(x=>x[1])].filter(Boolean);return rs.length?rs.reduce((a,b)=>a+b.mastery,0)/rs.length:0}
function showProgress(){progress.innerHTML='<h2 style="margin:0 0 8px">Mastery kotoba per arah</h2>'+Object.entries(DIR).map(([id,d])=>{let r=words.map(w=>state.records[w.id+'|'+id]).filter(Boolean),m=r.length?Math.round(r.reduce((a,b)=>a+b.mastery,0)/r.length):0;return `<div class="review-row"><div><b>${d.name}</b><br><small>${r.reduce((a,b)=>a+b.n,0)} jawaban · kesulitan ${d.weight}×</small></div><div class="bar"><i style="width:${m}%"></i></div><b>${m}%</b></div>`}).join('')+'<details><summary>Cara penilaian otomatis</summary>Mastery memakai benar/salah, kecepatan relatif untuk arah soal, dan konsistensi review. Salah kembali dalam ±5 menit; jawaban benar cepat mendapat interval bertahap. Tidak ada tombol self-rating.</details>'}
function showLesson(n){let o=objectives[n-1],f=grammarForms[n-1],p=patterns[n-1];study.className='overlay show';study.innerHTML=`<div class="study"><div class="study-top"><button class="ghost" onclick="closeStudy()">← Dashboard</button><span class="tag">N4 Lesson ${n}</span></div><section class="card question" style="margin-top:18px"><h1>${rubyText(o[0])}</h1><p class="muted">${rubyText(o[1])}</p><hr style="border:0;border-top:1px solid #e5eaf3;margin:22px 0"><span class="tag">Pola inti</span><div class="qtext" style="text-align:left;font-size:1.35rem">${rubyText(f[0])}</div><p>${rubyText(f[1])}</p><span class="tag">Contoh buatan</span><div class="qtext" style="text-align:left">${rubyText(p[0])}</div><p class="muted">${p[1]}</p><div class="actions"><button class="primary" onclick="startLessonPractice(${n})">Latihan Lesson ${n}</button><button onclick="showLesson(${n===24?1:n+1})">Lesson berikutnya →</button></div></section></div>`}
function startLessonPractice(n){run={type:'materi',lesson:n,start:Date.now(),end:Date.now()+900000,q:0,c:0,time:0,answered:false};nextQuestion();timer=setInterval(tick,250)}
function startSession(type){let s=state.sessions[day()]||{};if(s[type]&&!confirm('Sesi ini sudah tercatat. Mulai ulang sesi 15 menit?'))return;run={type,start:Date.now(),end:Date.now()+900000,q:0,c:0,time:0,answered:false};study.className='overlay show';nextQuestion();timer=setInterval(tick,250)}function tick(){let left=Math.max(0,run.end-Date.now());if(sessionTimer)sessionTimer.textContent=fmt(left);if(timeProgress)timeProgress.style.width=(100-left/9000)+'%';if(!left)finishSession()}function fmt(ms){let s=Math.ceil(ms/1000);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function choose(){let now=Date.now(),v=words.flatMap(w=>Object.keys(DIR).filter(d=>!DIR[d].requiresKanji||w.hasKanji).map(d=>({kind:'v',w,d,r:state.records[w.id+'|'+d]}))),g=patterns.flatMap((p,i)=>[0,1,2].map(variant=>({kind:'g',p,i,variant,r:state.grammar[(i+1)+'|'+variant]})));let all=run.type==='malam'?[...v,...g]:run.type==='pagi'?[...v.filter(x=>x.w.lesson<=3),...g.filter(x=>x.i<3),...v]:[...v,...g];if(run.lesson)all=[...v.filter(x=>x.w.lesson===run.lesson),...g.filter(x=>x.i+1===run.lesson)];let due=all.filter(x=>x.r?.due<=now),fresh=all.filter(x=>!x.r?.n),pool=due.length&&(run.type==='siang'||Math.random()<.55)?due:fresh.length?fresh:all;pool.sort((a,b)=>score(b,now)-score(a,now));return pool[0]}function score(x,now){let r=x.r||{},weak=100-(r.mastery||0),over=Math.max(0,now-(r.due||now))/36e5;return(weak*2+over*8+Math.random()*10)*(x.d?DIR[x.d].weight:1)}
function nextQuestion(){if(Date.now()>=run.end)return finishSession();run.answered=false;run.current=choose();run.shown=performance.now();let q=run.current,html=q.kind==='v'?vocabQuestion(q):grammarQuestion(q);study.innerHTML=`<div class="study"><div class="study-top"><button class="ghost" onclick="finishSession()">Selesai</button><div><span class="tag">${run.type==='pagi'?'Core':run.type==='siang'?'Review':'Exam practice'}</span> <span class="timer" id="sessionTimer">${fmt(run.end-Date.now())}</span></div></div><div class="progress"><i id="timeProgress"></i></div><section class="card question">${html}</section></div>`;tick()}function opts(correct,arr){return[correct,...arr.filter(x=>x!==correct).sort(()=>Math.random()-.5).slice(0,3)].sort(()=>Math.random()-.5)}
function vocabQuestion(q){let d=DIR[q.d],bank=words.filter(w=>!d.requiresKanji||w.hasKanji),o=opts(q.w[d.field],bank.map(w=>w[d.field]));return `<span class="tag">Kotoba · N4 L${q.w.lesson} · ${d.name}</span><div class="qtitle">${d.p(q.w)}</div><div class="hint">${d.h(q.w)}</div><div class="choices">${o.map((x,i)=>`<button class="choice" onclick="answer(${x===q.w[d.field]},this)"><span class="letter">${'ABCD'[i]}</span>${x}</button>`).join('')}</div><div id="feedback" class="feedback"></div><button id="next" class="primary next" onclick="nextQuestion()">Soal berikutnya →</button>`}function grammarQuestion(q){let correct,all,label,prompt;if(q.variant===0){correct=q.p[0];all=patterns.map(x=>x[0]);prompt='Pilih kalimat yang sesuai dengan arti berikut:';label=q.p[1]}else if(q.variant===1){correct=q.p[1];all=patterns.map(x=>x[1]);prompt='Pilih arti yang tepat untuk kalimat berikut:';label=q.p[0]}else{correct=grammarForms[q.i][0];all=grammarForms.map(x=>x[0]);prompt='Pilih pola utama yang diuji oleh contoh berikut:';label=q.p[0]}let o=opts(correct,all);return `<span class="tag">Bunpou · L${q.i+1} · ${objectives[q.i][0]} · Tipe ${q.variant+1}/3</span><div class="qtext">${prompt}</div><div class="qtitle" style="font-size:1.25rem">${label}</div><div class="choices">${o.map((x,i)=>`<button class="choice" onclick="answer(${x===correct},this)"><span class="letter">${'ABCD'[i]}</span>${x}</button>`).join('')}</div><div id="feedback" class="feedback"></div><button id="next" class="primary next" onclick="nextQuestion()">Soal berikutnya →</button>`}
function grammarAnswer(q){return q.variant===0?q.p[0]:q.variant===1?q.p[1]:grammarForms[q.i][0]}function answer(ok,b){if(run.answered)return;run.answered=true;let ms=Math.round(performance.now()-run.shown),q=run.current,r=q.kind==='v'?rec(q.w.id+'|'+q.d):grammarRec((q.i+1)+'|'+q.variant);r.n++;r.c+=+ok;r.t+=ms;r.streak=ok?r.streak+1:0;let target=(q.kind==='v'?DIR[q.d].weight:1)*6000,speed=Math.max(0,Math.min(1,(target-ms)/(target*.75)));r.mastery=ok?Math.round(Math.min(100,r.mastery*.72+100*(.2+.08*speed))):Math.round(r.mastery*.62);let stages=[.25,1,3,7,14,30];r.due=Date.now()+(ok?stages[Math.min(r.streak-1,5)]*864e5*(speed<.25?.55:1):300000);state.answered++;state.correct+=+ok;state.totalTime+=ms;run.q++;run.c+=+ok;run.time+=ms;save();document.querySelectorAll('.choice').forEach(x=>{x.disabled=true;if(x.textContent.includes(q.kind==='v'?q.w[DIR[q.d].field]:grammarAnswer(q)))x.classList.add('correct')});if(!ok)b.classList.add('wrong');feedback.className='feedback show '+(ok?'good':'bad');let sol=q.kind==='v'?`${q.w.kanji}（${q.w.reading}）= ${q.w.meaning}`:`${q.p[0]} = ${q.p[1]}<br><small>Pola inti: ${grammarForms[q.i][0]}</small>`;feedback.innerHTML=`<b>${ok?'✓ Benar':'✕ Belum tepat'}</b> — ${sol}<br><small>Waktu respons: ${(ms/1000).toFixed(1)} dtk · review ${ok?'dijadwalkan otomatis':'diulang ±5 menit lagi'}.</small>`;next.className='primary next show'}
function finishSession(){if(!run)return;clearInterval(timer);let s=state.sessions[day()]||{};s[run.type]={q:run.q,acc:run.q?Math.round(run.c/run.q*100):0};state.sessions[day()]=s;save();study.innerHTML=`<div class="study"><section class="card session-end"><span class="tag">Sesi ${run.type} dicatat</span><h1 style="margin:16px 0 0">Lanjut konsisten.</h1><div class="breakdown"><div class="metric"><b>${run.q}</b><small>soal</small></div><div class="metric"><b>${run.q?Math.round(run.c/run.q*100):0}%</b><small>akurasi</small></div><div class="metric"><b>${run.q?(run.time/run.q/1000).toFixed(1):'—'} dtk</b><small>rata-rata</small></div></div><button class="primary" onclick="closeStudy()">Kembali ke dashboard</button></section></div>`;run=null}function closeStudy(){study.className='overlay';renderHome()}function resetData(){if(confirm('Hapus seluruh progress N4 Trainer dari browser ini?')){localStorage.removeItem(KEY);state=load();renderHome()}}function exportData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.download='n4-trainer-backup-'+day()+'.json';a.click();URL.revokeObjectURL(a.href)}renderHome();
</script></body></html>
